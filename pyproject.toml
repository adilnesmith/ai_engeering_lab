[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "jarvis"
version = "0.1.0"
description = "A personal AI assistant demonstrating agentic AI patterns: tool use, multi-tier memory, and multi-agent orchestration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-ollama>=0.2,<0.3",
    "langchain-chroma>=0.1,<0.2",
    "langgraph>=0.2,<0.3",
    "langgraph-checkpoint-sqlite>=1.0",
    "aiosqlite>=0.20",
    "chromadb>=0.5,<0.6",
    "gradio>=5.0,<6.0",
    "pydantic>=2.0,<3.0",
    "ollama>=0.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "db*", "memory*", "tools*", "ui*"]
